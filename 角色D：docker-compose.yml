version: "3.8"

services:
  # ---- Flask 后端 ----
  backend:
    build: .
    container_name: ary-backend
    restart: unless-stopped
    entrypoint: ["/app/entrypoint.sh"]
    environment:
      - ARY_SECRET_KEY=${ARY_SECRET_KEY}
      - ARY_SUBMISSION_SECRET=${ARY_SUBMISSION_SECRET}
      - ARY_CORS_ORIGINS=${ARY_CORS_ORIGINS:-http://localhost}
      - ARY_DATABASE_PATH=/data/ary.db
      - ARY_JWT_EXPIRATION_HOURS=${ARY_JWT_EXPIRATION_HOURS:-1}
      - ARY_WORKERS=${ARY_WORKERS:-4}
      - ARY_LOG_LEVEL=${ARY_LOG_LEVEL:-info}
      - GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID:-}
      - GITHUB_OAUTH_CLIENT_SECRET=${GITHUB_OAUTH_CLIENT_SECRET:-}
    volumes:
      - ary_data:/data
    expose:
      - "8000"
    networks:
      - ary_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # ---- Nginx 反向代理 + 前端静态文件 ----
  nginx:
    image: nginx:1.25-alpine
    container_name: ary-nginx
    restart: unless-stopped
    ports:
      - "${ARY_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ary_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  ary_data:
    driver: local

networks:
  ary_network:
    driver: bridge
